<!DOCTYPE html>
<!--
  Wren BASIC 1, the thumbnail, and slide 0 of the set: the source of Wren_01_00_Thumbnail.png beside it.

  Shown live: open this file in Chrome and press F11. A click on the right half of the page
  opens the next slide, on the left half the one before; F5 plays a slide again. At a
  1920-wide screen the page is drawn half as big again, so it fills the screen.

  To render the PNG in Edge or Chrome:
    1. Open this file, press F12, then Ctrl+Shift+M for the device toolbar.
    2. Choose Responsive and set the size to 1280 x 720.
    3. From the toolbar's menu (the three dots) choose "Add device pixel ratio" and set it to 1.5.
    4. Wait for the animation to finish (about 3 seconds), then "Capture screenshot" from the same menu.
    5. The result is 1920 x 1080. Save it over Wren_01_00_Thumbnail.png.

  Sources:
    - The OLED screen: the emulator's panel, programs/OledThing/OledThing.bas with the inputs at
      $5A and the mode pins high, one SVG rect per run of lit pixels.
    - The LEDs: the emulator, programs/LedThing/LedThing.bas in mode 7 with the inputs at $5A.
    - "8 KB of flash, 1 KB of RAM": the Things' chip, docs/OledThing.md (Parts).
    - The boards are drawn, not photographed: no Digicool artwork is used.
    - The mark: art/wren.svg, the wren.

  Fonts: "Liberation Sans" and "DejaVu Sans Mono" (Arial and Consolas are close).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wren BASIC 1: Thumbnail</title>
<style>
/*HOUSE*/
  /* The Wren BASIC house style (docs/Videos/README.md): one colour to a meaning.
     Blue: Wren BASIC and the programs. Gold: the kernel and the point being made.
     Violet: the boards and their parts. Red: faults and flash wear. Pixel white: an OLED's pixels. */
  :root {
    --navy: #0f1b2d; --panel: #15243b; --panel-2: #1b2e4a; --line: #2b4063;
    --ink: #e5e7eb; --muted: #94a3b8;
    --gold: #fde68a; --gold-deep: #f59e0b;
    --basic: #60a5fa; --basic-soft: rgba(96, 165, 250, 0.16);
    --thing: #c4b5fd; --thing-soft: rgba(196, 181, 253, 0.14);
    --fault: #f87171;
    --pixel: #e6f0ff; --glass: #05070c;
    --led: #ff4b3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    position: relative;
    background-color: var(--navy);
    background-image:
      radial-gradient(1100px 700px at 100% 0%, rgba(96, 165, 250, 0.16), transparent 62%),
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: auto, 40px 40px, 40px 40px;
    color: var(--ink);
    font-family: "Liberation Sans", Arial, sans-serif;
  }
  .mono { font-family: "DejaVu Sans Mono", Consolas, monospace; }

  /* The chip, the channel's mark, the headline */
  .chip {
    position: absolute; left: 48px; top: 40px;
    padding: 10px 22px; border: 2px solid var(--gold); border-radius: 999px;
    color: var(--gold); font-size: 22px; font-weight: 700; letter-spacing: 0.12em;
  }
  .mark { position: absolute; right: 44px; top: 18px; display: flex; align-items: center; gap: 16px;
    color: var(--muted); font-size: 20px; font-weight: 700; letter-spacing: 0.16em; }
  .bird { width: 96px; height: 96px; filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45)); }
  h1 { position: absolute; left: 48px; top: 104px; font-size: 76px; line-height: 1.05; font-weight: 700; color: var(--gold); letter-spacing: -0.01em; }
  h1 span { color: #ffffff; }

  /* An OLED: black glass, white pixels with a little glow */
  .oled { background: var(--glass); border: 4px solid #334155; border-radius: 14px; box-shadow: 0 0 0 10px #0b1322, 0 20px 50px rgba(0,0,0,0.5); }
  .oled .px { display: block; width: 100%; height: 100%; }
  .px rect { fill: var(--pixel); }
  .px g { filter: drop-shadow(0 0 0.35px rgba(200, 225, 255, 0.9)); }

  /* LEDs: a red bar, lit or dark */
  .leds .led-off { fill: #3b1512; stroke: #5b2420; stroke-width: 2; }
  .leds .led-on { fill: var(--led); filter: drop-shadow(0 0 8px rgba(255, 75, 62, 0.9)); }

  /* Cards and labels */
  .card { position: absolute; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 28px 32px; }
  .card h2 { font-size: 34px; font-weight: 700; margin-bottom: 14px; }
  .label { font-size: 22px; font-weight: 700; letter-spacing: 0.14em; color: var(--muted); }
  .basic { color: var(--basic); } .kernel { color: var(--gold); } .thing { color: var(--thing); } .fault { color: var(--fault); }
  .caption { position: absolute; left: 48px; right: 48px; bottom: 40px; padding: 20px 28px; background: rgba(21, 36, 59, 0.92);
    border-left: 6px solid var(--gold); border-radius: 10px; font-size: 30px; line-height: 1.3; }

  /* Backdrops: the frames OBS fills (docs/Videos/How_We_Make_Videos.md section 6) */
  .frame { position: absolute; background: #000; border-radius: 6px; box-shadow: 0 0 0 3px #334155, 0 18px 40px rgba(0,0,0,0.5); }
  .console { left: 48px; top: 152px; width: 1114px; height: 762px; }
  .camera { left: 1210px; top: 152px; width: 662px; height: 372px; }
  .frame-label { position: absolute; font-size: 18px; font-weight: 700; letter-spacing: 0.16em; color: var(--muted); }
  .bar-title { position: absolute; left: 48px; top: 40px; display: flex; align-items: center; gap: 24px; }
  .bar-title .chip { position: static; }
  .bar-title .t { font-size: 46px; font-weight: 700; color: var(--gold); }
  .bar-title .t span { color: #fff; }

  /* A slide draws itself in about three seconds */
  .rise { animation: rise 0.6s ease-out both; }
  .pop { animation: pop 0.45s cubic-bezier(.2,1.4,.4,1) both; }
  .fade { animation: fade 0.8s ease-out both; }
  .draw { stroke-dasharray: 3000; stroke-dashoffset: 3000; animation: draw 1.1s ease-in-out forwards; }
  .grow { transform-origin: left center; animation: grow 0.9s ease-out both; }
  .d1 { animation-delay: 0.3s; } .d2 { animation-delay: 0.6s; } .d3 { animation-delay: 0.9s; }
  .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
  .d7 { animation-delay: 2.1s; } .d8 { animation-delay: 2.4s; } .d9 { animation-delay: 2.7s; }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }

  /* The slideshow: the right half is the next slide, the left half the one before */
  .nav { position: fixed; top: 0; bottom: 0; width: 50%; z-index: 100; cursor: default; }
  .nav.prev { left: 0; } .nav.next { right: 0; }
/*END HOUSE*/

  body { background-size: auto, 27px 27px, 27px 27px; }

  .b1 { top: 96px; } .b1 .oled { width: 444px; height: 222px; }
  .b2 { top: 420px; } .b2 .leds { display: block; width: 444px; height: 66px; }
  .ram { position: absolute; left: 44px; top: 548px; font-size: 32px; font-weight: 700; color: #fff; letter-spacing: 0.04em; }
  .ram b { color: var(--basic); }
  .brand { position: absolute; left: 30px; bottom: 18px; display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 700; letter-spacing: 0.14em; color: var(--muted); }
  .brand .bird { width: 96px; height: 96px; }
